# Keep the container's journal and the host's kernel log separate.
#
# Ubiquiti's rootfs ships journald with stock defaults. As PID 1 inside a
# privileged container, that journald has access to the *host's* /dev/kmsg and
# reads it, so the container journal fills up with host kernel messages
# (apparmor audit lines from every runc exec on the node, for example) and the
# UniFi services' own logs get buried. /var/log is symlinked into the /unifi
# volume, so that noise is also written to persistent storage.
#
# ForwardToKMsg is the same leak in the other direction: it writes container
# messages into the host's kernel ring buffer, where they surface in the host's
# journal indistinguishable from the host's own. That is what made a
# `systemd-shutdown[1]: Halting system` from this container appear inside a
# still-running host boot.
[Journal]
ReadKMsg=no
ForwardToKMsg=no
